[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weppcliff"
version = "2.1.0"
description = "Python port of WEPPCLIFF — climate input processor for WEPP and USLE-family models"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "pymice-fcs[ml] @ git+https://github.com/ryanpmcg/PyMICE.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
fast = ["numba>=0.59"]
parquet = ["pyarrow>=15"]

[project.scripts]
weppcliff = "Source.main:cli_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["Source*"]

[tool.pytest.ini_options]
testpaths = ["Development/tests"]
pythonpath = ["."]